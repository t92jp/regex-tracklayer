name: Deploy to GitHub Pages

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js (for npm / elm if needed, or skip if manual curl)
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Elm compiler
        run: |
          # 公式リリースから Elm 0.19.1 のバイナリを直接ダウンロードしてセットアップ
          curl -L https://github.com/elm/compiler/releases/download/0.19.1/binary-for-linux-64-bit.gz | gunzip > /usr/local/bin/elm
          chmod +x /usr/local/bin/elm
          elm --version

      - name: Build Elm application
        run: |
          # ビルド成果物をまとめるディレクトリを作成
          mkdir -p dist/assets
          
          # Elmのコンパイル実行（--optimize オプションつき）
          elm make src/Main.elm --optimize --output=dist/elm.js
          
          # 静体ファイルを dist/ にコピー
          cp index.html ports.js style.css dist/
          if [ -d "assets" ]; then
            cp -r assets/* dist/assets/
          fi

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4