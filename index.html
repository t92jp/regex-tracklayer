<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Regex Tracklayer</title>
<link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;700&family=Zen+Kaku+Gothic+New:wght@500;700&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- Icons: <svg class="i"><use href="#i-名前"/></svg> で参照する。JS からは ICON.名前 で取れる。 -->
<svg id="icons" hidden>
  <symbol id="i-undo" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 14 4 9l5-5"/><path d="M4 9h10a6 6 0 0 1 0 12h-3"/></symbol>
  <symbol id="i-trash" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/></symbol>
  <symbol id="i-copy" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V6a1 1 0 0 1 1-1h9"/></symbol>
  <symbol id="i-check" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5 10 17.5 19 7"/></symbol>
  <symbol id="i-x" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 6l12 12M18 6 6 18"/></symbol>
  <symbol id="i-fork" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12h6l6-6h6M9 12l6 6h6"/></symbol>
  <symbol id="i-tidy" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 3l1.6 4.4L16 9l-4.4 1.6L10 15l-1.6-4.4L4 9l4.4-1.6z"/><path d="M18 13l.9 2.1L21 16l-2.1.9L18 19l-.9-2.1L15 16l2.1-.9z"/></symbol>
  <symbol id="i-lazy" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 15h7c4 0 5-6 11-6"/><path d="M14 15h7" stroke-dasharray="2 3"/></symbol>
  <symbol id="i-plus" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></symbol>
  <symbol id="i-signal" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="8" y="2" width="8" height="13" rx="4"/><circle cx="12" cy="6" r="1.3"/><circle cx="12" cy="11" r="1.3"/><path d="M12 15v7M8 22h8"/></symbol>
  <symbol id="i-left" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M11 6l-6 6 6 6"/></symbol>
  <symbol id="i-right" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></symbol>
  <!-- 信号機(赤/緑): 線ではなく塗りで描く -->
  <symbol id="i-sigR" viewBox="0 0 24 24"><rect x="7" y="1" width="10" height="22" rx="5" style="fill:currentColor"/><circle cx="12" cy="7" r="3.2" style="fill:var(--c-look)"/><circle cx="12" cy="17" r="3.2" style="fill:var(--good);opacity:.3"/></symbol>
  <symbol id="i-sigG" viewBox="0 0 24 24"><rect x="7" y="1" width="10" height="22" rx="5" style="fill:currentColor"/><circle cx="12" cy="7" r="3.2" style="fill:var(--c-look);opacity:.3"/><circle cx="12" cy="17" r="3.2" style="fill:var(--good)"/></symbol>
</svg>

<header class="top">
  <h1><span>Regex Tracklayer</span></h1>
  <div class="tools">
    <button class="b ic" id="tidy" aria-label="Tidy up track" title="Tidy up track" disabled><svg class="i" aria-hidden="true"><use href="#i-tidy"/></svg></button>
    <button class="b ic" id="undo" aria-label="Undo" title="Undo" disabled><svg class="i" aria-hidden="true"><use href="#i-undo"/></svg></button>
    <button class="b ic" id="clear" aria-label="Clear all" title="Clear all"><svg class="i" aria-hidden="true"><use href="#i-trash"/></svg></button>
  </div>
</header>

<main id="stage"><svg id="rail" role="group" aria-label="Track diagram"></svg></main>

<section id="dock">
  <div id="tray" role="toolbar" aria-label="Stations">
    <button class="tk lit" data-k="lit" title="Text">abc</button>
    <button class="tk cls" data-k="\d" title="Digit">\d</button>
    <button class="tk cls" data-k="\w" title="Word character">\w</button>
    <button class="tk cls" data-k="\s" title="Whitespace">\s</button>
    <button class="tk cls" data-k="." title="Any character">.</button>
    <button class="tk set" data-k="set" title="Character set">[ ]</button>
    <button class="tk look" data-k="look" title="Signal (lookahead / lookbehind)"><svg class="i" aria-hidden="true"><use href="#i-signal"/></svg></button>
    <span class="tz" aria-hidden="true"><svg class="i" aria-hidden="true"><use href="#i-trash"/></svg></span>
  </div>
  <div id="panel" hidden></div>
  <div class="out">
    <code id="out" aria-live="polite"></code>
    <button class="b ic" id="copy" aria-label="Copy" title="Copy"><svg class="i" aria-hidden="true"><use href="#i-copy"/></svg></button>
  </div>
  <div class="test">
    <input id="t" type="text" maxlength="120" placeholder="Try a string" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" aria-label="Test string">
    <div id="res" hidden></div>
  </div>
</section>
<script src="app.js"></script>
</body>
</html>
